# Tests every push and pull request on each platform Cortex ships for.
name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: test (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        # Keep in step with cortex/ui_runtime/platforms.py.
        runner: [macos-14, macos-15-intel, ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.9"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tmux (TUI E2E tests)
        run: |
          if command -v apt-get >/dev/null; then
            sudo apt-get update -q && sudo apt-get install -y -q tmux
          else
            brew install tmux
          fi

      - name: Install Cortex for development
        run: python -m pip install -e ".[dev]"

      - name: Frontend typecheck, tests and sidecar build
        run: |
          cd frontend/cortex-tui
          bun install --frozen-lockfile
          bun run typecheck
          bun test
          bun run build

      - name: Lint and type-check
        run: |
          ruff check cortex tests
          ./scripts/typecheck.sh

      - name: Test
        run: python -m pytest tests -q -p no:cacheprovider
