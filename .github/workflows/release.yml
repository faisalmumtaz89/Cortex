# Release pipeline. Pushing a tag `vX.Y.Z` builds one wheel per platform, each
# on its own runner with a TUI sidecar compiled for that platform; installs
# each wheel the way a new user does and smoke-tests it there; and only then
# attaches every wheel and its `.sha256` sibling to a GitHub release.
#
# GitHub Releases is the SINGLE distribution channel: install.sh and
# /update cortex find the latest version through GitHub's releases/latest
# redirect and download this machine's wheel from that same release. A version
# is either fully live (every platform's wheel verified installable) or does
# not exist at all.
#
# Running it by hand (workflow_dispatch) is a dry run: it builds and
# smoke-tests every platform and publishes nothing. Run by hand on main with
# `publish` checked, it does the same and then releases that commit as
# v<pyproject version>, creating the tag.
#
# ORDERING IS LOAD-BEARING: release creation stays LAST, after every gate on
# every platform.

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish:
        description: "Release this commit as v<pyproject version> (main only)"
        type: boolean
        default: false

# One release at a time; never cancel a half-published run (re-runs are
# idempotent instead: softprops updates the existing release by tag and
# replaces same-named assets — overwrite_files is pinned explicitly below).
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write # create the GitHub release

jobs:
  build:
    name: wheel (${{ matrix.wheel_tag }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # Keep in step with cortex/ui_runtime/platforms.py.
          - runner: macos-14
            wheel_tag: macosx_13_0_arm64
            managed_python: "1"
          - runner: macos-15-intel
            wheel_tag: macosx_13_0_x86_64
            managed_python: "0"
          - runner: ubuntu-24.04
            wheel_tag: manylinux_2_28_x86_64
            managed_python: "1"
          - runner: ubuntu-24.04-arm
            wheel_tag: manylinux_2_28_aarch64
            managed_python: "0"
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          # Pinned: the shipped sidecar's toolchain must be reproducible
          # (keep in sync with frontend/cortex-tui/package.json).
          bun-version: "1.3.9"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify tag matches the package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          package_version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          if [[ "${tag_version}" != "${package_version}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match pyproject version ${package_version}" >&2
            exit 1
          fi

      - name: Build TUI sidecar (for this runner's platform)
        run: |
          cd frontend/cortex-tui
          bun install
          bun run build

      - name: Build wheel
        env:
          CORTEX_WHEEL_PLATFORM: ${{ matrix.wheel_tag }}
        run: |
          python -m pip install --upgrade build
          python -m build --wheel

      - name: Fail unless the wheel bundles the sidecar and carries this platform's tag
        run: |
          wheel="$(ls dist/*.whl)"
          echo "Inspecting ${wheel}"
          case "$(basename "${wheel}")" in
            *-py3-none-${{ matrix.wheel_tag }}.whl) ;;
            *)
              echo "Wheel is not tagged ${{ matrix.wheel_tag }}: a native sidecar must never ship under another platform's tag." >&2
              exit 1
              ;;
          esac
          if ! python -m zipfile -l "${wheel}" | grep -q "cortex/ui_runtime/bin/cortex-tui"; then
            echo "cortex/ui_runtime/bin/cortex-tui is missing from the wheel — the published package would have no TUI." >&2
            exit 1
          fi

      # Installers refuse to install a wheel without this sibling: the asset
      # name is `<wheel>.sha256` and the content is the standard
      # "<64-hex>  <wheel filename>" line (first whitespace token = digest).
      - name: Generate the wheel's sha256 sidecar asset
        run: |
          cd dist
          wheel="$(basename "$(ls ./*.whl)")"
          python -c 'import hashlib, sys; w = sys.argv[1]; print(hashlib.sha256(open(w, "rb").read()).hexdigest() + "  " + w)' "${wheel}" > "${wheel}.sha256"
          cat "${wheel}.sha256"

      - name: Smoke-test the install on this platform (install.sh, CLI, headless turn, TUI)
        timeout-minutes: 10
        run: scripts/smoke_install.sh dist

      - name: Smoke-test the install with install.sh's private Python
        if: matrix.managed_python == '1'
        timeout-minutes: 10
        env:
          CORTEX_MANAGED_PYTHON: "1"
        run: scripts/smoke_install.sh dist

      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.wheel_tag }}
          path: dist/*
          if-no-files-found: error

  windows-installer:
    name: Windows installer (WSL)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint install.ps1
        shell: pwsh
        run: |
          # The PowerShell Gallery fails a download now and then: try again.
          foreach ($attempt in 1..4) {
            try { Install-Module PSScriptAnalyzer -Force -Scope CurrentUser -ErrorAction Stop; break }
            catch { if ($attempt -eq 4) { throw }; Start-Sleep -Seconds (10 * $attempt) }
          }
          $issues = Invoke-ScriptAnalyzer -Path install.ps1 -Severity Error
          if ($issues) { $issues | Format-List; exit 1 }
      - name: install.ps1 explains WSL setup on a machine without a Linux distribution
        shell: pwsh
        run: |
          $out = & { . ./install.ps1 } *>&1 | Out-String
          Write-Host $out
          if ($out -notmatch 'wsl --install') { Write-Error 'install.ps1 did not explain how to set up WSL'; exit 1 }
          # The runner has no distribution, so wsl.exe's own exit code is non-zero; the message is the check.
          exit 0

  release:
    needs: [build, windows-installer]
    if: startsWith(github.ref, 'refs/tags/v') || (inputs.publish && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # A pushed tag must match the version; a published main commit gets the
      # version's tag, which must not already name another commit.
      - name: Resolve the release tag
        id: tag
        run: |
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          tag="v${version}"
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            if [[ "${GITHUB_REF_NAME}" != "${tag}" ]]; then
              echo "Tag ${GITHUB_REF_NAME} does not match pyproject version ${version}" >&2
              exit 1
            fi
          else
            # The last line is the commit an annotated tag points to.
            existing="$(git ls-remote origin "refs/tags/${tag}" "refs/tags/${tag}^{}" | tail -n1 | cut -f1)"
            if [[ -n "${existing}" && "${existing}" != "${GITHUB_SHA}" ]]; then
              echo "${tag} already names ${existing}, not ${GITHUB_SHA}" >&2
              exit 1
            fi
          fi
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"

      - uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true

      - name: Fail unless every platform's wheel is here
        run: |
          ls -l dist
          test "$(ls dist/*.whl | wc -l)" -eq 4
          test "$(ls dist/*.whl.sha256 | wc -l)" -eq 4

      # The release IS the install source: install.sh and /update cortex
      # resolve the version through the releases/latest redirect, download
      # this machine's wheel asset, and verify it against the .sha256 sibling.
      # Created LAST, strictly after every gate above.
      - name: Create GitHub release with wheel + sha256 assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: |
            dist/*.whl
            dist/*.whl.sha256
          # Explicit (today's @v2 default): a re-run against an existing
          # release must REPLACE same-named assets, never duplicate them.
          overwrite_files: true
          generate_release_notes: true
